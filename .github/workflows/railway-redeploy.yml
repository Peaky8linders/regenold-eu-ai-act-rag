name: Redeploy Railway production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-redeploy-production
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Redeploy from Git source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. See docs/partners/regenold/RAILWAY_DEPLOY.md"
            exit 1
          fi
          ARGS=(redeploy --yes --from-source)
          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then ARGS+=(--service "$RAILWAY_SERVICE_ID"); fi
          if [ -n "${RAILWAY_ENVIRONMENT:-}" ]; then ARGS+=(-e "$RAILWAY_ENVIRONMENT"); fi
          if [ -n "${RAILWAY_PROJECT_ID:-}" ]; then ARGS+=(-p "$RAILWAY_PROJECT_ID"); fi
          npx --yes @railway/cli@4.65.0 "${ARGS[@]}"
