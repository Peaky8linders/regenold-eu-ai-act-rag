[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regenold-eu-ai-act-rag"
version = "0.1.4"
description = "Standalone EU AI Act grounded Q&A — Regenold partner transparency bundle."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  {name = "Antifragile AI", email = "compliance@antifragile-ai.net"},
]
dependencies = [
  # fastapi 0.136.3 (MAL-2026-4750) — supply-chain attack via typosquat
  # `fastar>=0.9.0` quietly added to [standard] extras. Cap below until
  # a clean upstream release purges it. Keep this in sync with the
  # mirror pin in requirements.txt.
  "fastapi>=0.115.0,<0.136.3",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.4.0",
  "slowapi>=0.1.9",
  "structlog>=24.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
neo4j = ["neo4j>=5.0.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C90"]
# E501: long lines — most are wrapped already; the few long ones are URL/regex strings.
# C901: cyclomatic complexity — the route handler + eval runner are
#       legitimately complex orchestrators; refactoring would obscure the
#       readable linear flow that mirrors the parent codebase.
# UP042: enum.StrEnum — parent CodexAI codebase uses `(str, Enum)` for
#       wire-shape compat; switching here would diverge from the verbatim
#       copies we're tracking.
ignore = ["E501", "C901", "UP042"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]
