[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Defaults applied at deploy time — operators can override any of these
# from the Railway dashboard or via ``railway variables --set KEY=VALUE``.
[deploy.envs]
# Enable the Round-31.1 GraphRAG 2-hop expand path by default.
# Lifts Ref Correctness Loose +0.087 / Strict +0.039 on the davidath
# benchmark (see CLAUDE.md round 31.1 scorecard). Flip off with
# ``railway variables --set REGENOLD_GRAPH_2HOP=0`` if a future round
# regresses on it.
REGENOLD_GRAPH_2HOP = "1"

# Auto-seed Neo4j on boot when NEO4J_URI is set. Default ON — operators
# who want to manage the graph manually can disable with
# ``railway variables --set NEO4J_AUTO_SEED=0``.
NEO4J_AUTO_SEED = "1"

# R47-B — Enable graph-aware retrieval (definition lookup + recital
# grounding) via ``app/engines/graph_aware_retrieval.py``. Requires
# ``NEO4J_URI`` to be set (which it is on this deploy per R35). When
# the graph client can't be resolved, every helper is a sub-µs
# passthrough so flipping this ON has zero cost in degraded states.
# Lifts Ans Strict + multi-turn coherence on the V2 eval — see
# ``CLAUDE.md`` round 47-B scorecard.
REGENOLD_GRAPH_AWARE = "1"

# Round 66-B — Stage-2.5 cite-describe guard. Drops references whose
# KB-summary token set doesn't overlap the answer prose (the inverse
# of the R31 sentence-level citation guard which drops sentences).
# Targets the LLM-as-Judge ``refs`` axis where the judge fails a row
# whose prose never substantively describes a cited Article.
#
# Default ON post-R66 cumulative bench: the full 476-row davidath
# scorecard with the guard ON measured **rubric-positive** —
# RefLoose held flat at 0.565, RefStrict +0.0055 (0.4427 → 0.4482),
# RefConciseness +0.0059 (0.4087 → 0.4146), no regressions on Ans
# Strict / tone / multi-turn coherence. The expected judge-axis lift
# (every dropped ref is one less prose-mismatch failure) is on top
# of the davidath positive. Disable with:
#   railway variables --set REGENOLD_CITE_DESCRIBE_GUARD=0
REGENOLD_CITE_DESCRIBE_GUARD = "1"

# Round 77 — Stage-2 LLM polish master switch. DEFAULT OFF.
#
# The R76 representative-100 live measurement (production Railway +
# Claude Max) found the Stage-2 polish pass net-negative on every
# LLM-as-judge axis vs the deterministic Stage-1 answer it replaces:
# refs-faithfulness 0.13 vs 0.25, conciseness 0.23 vs 0.55, tone
# 0.65 vs 0.88, flat on correctness, and 3.5x slower (p50 19.6 s vs
# 5.6 s). Disabling it drops live p50 latency ~17 s -> ~5 s (a scored
# competition axis) and lifts three judge axes at once.
#
# The code default is OFF, so this deploy ships with Stage-2 disabled
# without needing this line. To A/B a future Stage-2 prompt revision,
# re-enable with:
#   railway variables --set P2P_GRAPH_RAG_ENABLE_STAGE2=1
# P2P_GRAPH_RAG_ENABLE_STAGE2 = "0"

# Round 52 — Stage-0 intent classifier provider selection.
#
# Default ("" or "wrapper" semantics): Haiku 4.5 via the Claude Max
# wrapper (existing behaviour). Set to "groq" to route Stage-0 through
# Groq's serverless Llama 3.3 70B endpoint instead. Requires
# ``GROQ_API_KEY`` to be ALSO set; if the key is missing, the classifier
# falls back to the wrapper (no surprise silent disablement).
#
# Why this exists: planning a Claude Max → Claude Pro downgrade. Pro's
# tighter rate limits would throttle the wrapper, so the cheapest
# stage to offload (Stage-0 — a 10-way JSON classification, falls back
# cleanly to deterministic on any failure) goes to Groq first. Cost
# delta: roughly $200/mo → ~$0.50/mo at this project's volume.
# Stage-1/2 polish stays on the wrapper for tone + V2 coherence
# preservation. See CLAUDE.md round-52 for the migration plan.
#
# Provision the key via:
#   railway variables --set GROQ_API_KEY=gsk_...
#   railway variables --set REGENOLD_INTENT_PROVIDER=groq
# REGENOLD_INTENT_PROVIDER = "groq"
# GROQ_API_KEY             = "gsk_..."          # set via railway variables, not toml
# GROQ_API_BASE            = "https://api.groq.com/openai/v1"    # default
# REGENOLD_INTENT_MODEL_GROQ = "llama-3.3-70b-versatile"          # default
# GROQ_TIMEOUT_SECONDS     = "5"                                  # default
