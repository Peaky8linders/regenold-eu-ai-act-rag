[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Defaults applied at deploy time — operators can override any of these
# from the Railway dashboard or via ``railway variables --set KEY=VALUE``.
[deploy.envs]
# Enable the Round-31.1 GraphRAG 2-hop expand path by default.
# Lifts Ref Correctness Loose +0.087 / Strict +0.039 on the davidath
# benchmark (see CLAUDE.md round 31.1 scorecard). Flip off with
# ``railway variables --set REGENOLD_GRAPH_2HOP=0`` if a future round
# regresses on it.
REGENOLD_GRAPH_2HOP = "1"
# F1 fix (default ON in code) — the 2-hop SQL ``LIMIT`` was sized
# ``max(max_hop2*2, 4)`` = 10, which the 1-hop neighbours of any HUB seed
# (Art. 5/6/26 each ≥10) fill entirely, so ZERO hop2-only refs survived →
# the 2-hop feature contributed nothing for the most-common anchors. The
# fix sizes the cap to the catalog ceiling so the Python-side ``max_hop2``
# cap is the binding output limit. This is a LIVE retrieval change (more
# hop2 refs surface, additively-below-budget); roll back with:
#   railway variables --set REGENOLD_GRAPH_2HOP_FULL_CAP=0
REGENOLD_GRAPH_2HOP_FULL_CAP = "1"
# R117 — provider architecture (operator directive): Groq for FAST Stage-0
# intent detection, then the Cloudflare-tunnel Claude Max subscription ALWAYS
# for Stage-1/2 polish + reasoning.
#
#   * Stage-0 intent classification -> Groq Llama 3.3 70B (fast, cheap).
#     REGENOLD_INTENT_PROVIDER=groq below; GROQ_API_KEY is a dashboard secret.
#   * Stage-1 parse + Stage-2 polish + reasoning -> Claude Max via the
#     openai_wrapper (the Cloudflare named tunnel -> NSSM wrapper -> Claude Max).
#     OPENAI_API_BASE (tunnel URL) + OPENAI_API_KEY are dashboard secrets.
#
# The earlier provider="groq" was a split-brain: the Groq Stage-2 routing was
# added then silently reverted (commit 9dba937), so Stage-2 routed to the
# wrapper while _stage2_provider_enabled() gated it on GROQ_API_KEY. Setting the
# graph-RAG provider to the wrapper makes the Stage-2 gate consistent with the
# code. NOTE: Railway dashboard service variables override this [deploy.envs]
# block (the R80.2 phenomenon) — verify the dashboard does not pin
# P2P_GRAPH_RAG_PROVIDER / REGENOLD_INTENT_PROVIDER to stale values.
P2P_GRAPH_RAG_PROVIDER = "openai_wrapper"
# Stage-2 polish + reasoning ALWAYS on (the Claude Max tunnel). The code default
# is already ON (R80.2); pinned here explicitly per the operator directive.
P2P_GRAPH_RAG_ENABLE_STAGE2 = "1"
# Stage-0 intent detection on Groq (fast). Requires GROQ_API_KEY in the
# dashboard; without it the classifier falls back cleanly to the wrapper (no
# silent disablement). The free Groq tier has a 100K tokens/day cap, so use a
# paid tier for sustained production volume.
REGENOLD_INTENT_PROVIDER = "groq"
REGENOLD_LOGIC_RAG = "1"

# R-Fusion — Mixture-of-Agents Stage-2 (app/engines/fusion.py). On a complex
# Stage-2 synthesis, a diverse panel answers in parallel — Opus 4.8 (Claude
# Max via the Cloudflare tunnel) + Groq Llama 3.3 70B + Mistral Large — then a
# JUDGE picks the single best draft, reusing the exact same EU AI Act
# references block. The OpenRouter "Fusion" principle, run on the flat Max
# subscription + cheap serverless tokens instead of per-completion billing.
# Requires GROQ_API_KEY + MISTRAL_API_KEY (dashboard secrets) for the full
# 3-model panel; with fewer than 2 panel transports live it falls through to the
# single-Sonnet Stage-2 (fail-soft, never breaks the wire). Default ON in CODE
# (fusion.fusion_stage2_enabled) per the R80.2 dashboard-override lesson; this
# entry documents intent + rollback. Disable with:
#   railway variables --set REGENOLD_FUSION_STAGE2=0
# R127 — the JUDGE is now DETERMINISTIC by default (fusion.fusion_judge_mode):
# it SELECTS the best panel draft with a pure-Python rubric scorer + NO extra
# LLM call, removing the second serialized Max-tunnel round-trip (panel→judge)
# and roughly halving complex-question latency, while keeping generation 100%
# on Max ($0). Restore the historical Sonnet SELECT-and-polish LLM judge with:
#   railway variables --set REGENOLD_FUSION_JUDGE=llm
# Tune the panel / judge:
#   REGENOLD_FUSION_PANEL="sonnet,groq,mistral"   (also: opus, gemini)
#   REGENOLD_FUSION_JUDGE_MODEL="claude-sonnet-4-6"   (only used when JUDGE=llm)
#   REGENOLD_FUSION_MIN_CANDIDATES="2"   REGENOLD_FUSION_TIMEOUT="60"
REGENOLD_FUSION_STAGE2 = "1"
REGENOLD_FUSION_JUDGE = "deterministic"
# R124 — fusion LATENCY optimisation. The panel + judge cost 2 wrapper
# round-trips on the single slow Max tunnel, so we (a) GATE the panel to fire
# only on complex questions — simple questions take the cheaper single-Sonnet
# polish (1 wrapper call); (b) on complex, SWAP the wrapper member Sonnet→Opus
# (one wrapper-bound member, not two — Groq + Mistral run parallel on their own
# endpoints); (c) give the fast serverless members a tighter timeout. Net:
# ~1 wrapper call on the easy majority, ~2 on the hard tail (was 2-3).
# Default in CODE (fusion.fusion_gate / _fast_timeout_seconds); these entries
# document intent + rollback. Restore R123 fuse-everything with
#   railway variables --set REGENOLD_FUSION_GATE=all
REGENOLD_FUSION_GATE = "complex"
REGENOLD_FUSION_FAST_TIMEOUT = "25"

# R98 / R121 / R127 — graph backend selector. The master switch has THREE values:
#   * "embedded" (R127 DEFAULT) — Orbit-pattern in-process SQLite property
#                graph (app/graph/embedded_graph.py). Serves the 2-hop
#                CROSS_REFERENCES traversal with ZERO external service: no
#                Aura, no seed step, no duplicate-node drift (the R98 ~20× /
#                R99.1 empty-graph problems), always in sync with KB_VERSION.
#                Built in-process from the SAME kb_xrefs source the seeder
#                used → identical neighbours, sub-ms, $0. This is also baked
#                as the CODE default (embedded_graph.graph_backend), so a
#                deploy whose dashboard still pins this var to neo4j must
#                clear it to pick up embedded. When embedded is active the
#                Neo4j driver is gated OFF (client._should_activate) even if
#                a stale NEO4J_URI lingers — no Aura retrieval/seed cost.
#   * "neo4j"    — opt back into the hosted Neo4j Aura path (creds NEO4J_URI
#                / NEO4J_USERNAME / NEO4J_PASSWORD in the dashboard):
#                  railway variables --set REGENOLD_GRAPH_BACKEND=neo4j
#   * "rushdb"   — re-enables the RushDB dual-path (also needs
#                RUSHDB_AUTH_TOKEN). Opt-in only since R98 (free-trial limits).
REGENOLD_GRAPH_BACKEND = "embedded"

# Auto-seed Neo4j on boot when NEO4J_URI is set. Default ON — operators
# who want to manage the graph manually can disable with
# ``railway variables --set NEO4J_AUTO_SEED=0``.
NEO4J_AUTO_SEED = "1"

# R47-B — Enable graph-aware retrieval (definition lookup + recital
# grounding) via ``app/engines/graph_aware_retrieval.py``. Requires
# ``NEO4J_URI`` to be set (which it is on this deploy per R35). When
# the graph client can't be resolved, every helper is a sub-µs
# passthrough so flipping this ON has zero cost in degraded states.
# Lifts Ans Strict + multi-turn coherence on the V2 eval — see
# ``CLAUDE.md`` round 47-B scorecard.
REGENOLD_GRAPH_AWARE = "1"

# R110 — Sufficient-Context bounded multi-hop decomposition (the FRAMES /
# Google Sufficient-Context-Agent methodology, made latency/cost/governance
# bounded). After the first retrieval, a deterministic missing-pieces analysis
# fires ONE bounded hop (≤3 deterministic sub-query retrievals, no LLM) when a
# complex/multi-part question's first pass missed a named anchor or a sub-part,
# UNIONing the result additively-below-cap. Every sub-query + source touched is
# logged to the ReasoningTrace audit lineage (glass-box). davidath byte-identical
# (the deterministic parse + BM25 already saturate that corpus); the win lands on
# the production Neo4j path + the live judge axes. Tune the hop cap with
# ``REGENOLD_SUFFICIENT_CONTEXT_MAX_HOPS`` (default 3, clamp [1,5]).
#
# R110.1 — the gate ALSO defaults ON in CODE
# (``sufficient_context.sufficient_context_enabled``). A live probe after the
# R110 deploy showed this ``[deploy.envs]`` entry was NOT applied to the
# running service (the R80.2 phenomenon), so per the R80.2 doctrine the ON
# default is baked into code. This entry is kept as belt-and-suspenders +
# intent documentation. Disable explicitly with REGENOLD_SUFFICIENT_CONTEXT=0.
REGENOLD_SUFFICIENT_CONTEXT = "1"

# Round 89-A — Article-level describer force-append for V2 multi-turn.
# When ON, the 10 R89-A article-level describer keys (Art 27 FRIA, Art
# 73 incident-15-days, Art 51 systemic-risk-notify, Art 53 FOSS carve-
# out, Art 50 cumulative-with-13, Art 60 real-world testing, Art 99
# proportionate-SME, Art 56 codes-of-practice, Art 111 transitional-
# grandfather, Art 86 right-to-explanation) bypass the augmenter's
# is_covered gate and PREPEND their describer prose — so V2 multi-turn
# rows whose Stage-2 answer already mentions the Article by name but
# misses the gold-keyword surface (FRIA / 15 days / 10²⁵ / etc.) get
# the rubric-scored keywords landed.
#
# Default OFF in code (app/integrations/regenold/grounded_prose.py)
# because flipping it ON globally tanks davidath Ans Conciseness by
# -0.06 (double-mentions when the KB stub already covered the ref on
# single-turn QA / scenarios). Setting it ON via railway.toml
# activates it for the live deploy where the V2 lift dominates;
# the bench runner doesn't read this file so davidath stays clean.
REGENOLD_R89A_FORCE_APPEND = "1"

# R93 — role-obligation NOUN seed. The R87-D role-duty seed only fired
# on action-verb shapes ("When must a deployer report…?"); the live
# fresh-200 probe found the canonical NOUN shape ("What obligations does
# a provider have?") missing the role's Article entirely (Art. 16 for a
# provider-obligations question). This flips the noun trigger ON for the
# live deploy. Default OFF in code so the davidath bench stays
# byte-identical (on some davidath role rows the gold is narrower than
# the role Article, dipping Ref Strict ~0.005); the bench runner doesn't
# read railway.toml, so the live win lands without a bench regression.
REGENOLD_ROLE_DUTY_NOUN_SEED = "1"

# R93 — natural-language AI-use-case scope rescue. Closes the ~22%
# false-out-of-scope hole on natural questions that describe an AI system
# + ask its regulatory treatment but name no Article/anchor keyword
# ("Can we install AI cameras to track student attention?"). Default ON
# in code already (this entry documents it + lets an operator disable
# with REGENOLD_AI_USECASE_RESCUE=0). OOS probe holds 21/21.
REGENOLD_AI_USECASE_RESCUE = "1"

# R94 — complete-clause / no-run-on augmenter fix. The deterministic
# per-ref description augmenter (`grounded_prose.augment_with_ref_
# descriptions`) clipped a stub's first sentence at a 90-char word
# boundary, leaving a dangling conjunction ("...register themselves
# and.") and run-on joins between cited articles — the R93 fresh-200
# judge's "incomplete sentence / truncated regulatory statement" tone
# failures (fresh_021-025). Default OFF in code so the davidath bench
# stays byte-identical (the complete clauses are longer → the quadratic
# conciseness metric dings −0.058; the bench runner doesn't read
# railway.toml). Flipped ON here for the live deploy where the LLM judge
# scores answer completeness, not token-length-ratio — the R78
# davidath-wash / live-win discipline.
REGENOLD_CLAUSE_COMPLETE = "1"

# Round 95-P0 — over-citation noise-anchor suppression. Drops phantom
# broad anchors (Art. 3 definitions, Art. 5 RBI prohibition, Art. 6
# high-risk classification, Art. 51 GPAI systemic) from the candidate
# list on QA-shape questions when the question lacks that anchor's topic
# signal AND a more-specific article survives. Closes the r94-live
# over-citation floor (Art. 6 ×29 / Art. 3 ×13 / Art. 51 ×11 phantom
# cites dragging the judge refs axis 0.37) by tightening the SOURCE,
# NOT post-hoc pruning (R90 proved cite-describe pruning is −0.21
# ref_loose on the competition bench). Default ON in code already
# (davidath byte-identical — the gates protect gold anchors; the win
# is the live judge refs axis). Also closes R95-P1 transparency_
# disclosure → Art. 50 (the Art. 5 RBI demotion lets Art. 50 lead a
# chatbot/disclosure question). Disable with REGENOLD_NOISE_SUPPRESS=0.
REGENOLD_NOISE_SUPPRESS = "1"

# Round 95-P1 — hard char-cap backstop (R78 knob). With Stage-2 polish
# ON (R80.2 default), Sonnet occasionally produces >600-char answers
# (single cite-anchored (a)…(b)…(c)… enumerations) the LLM judge counts
# as ">4 sentences" → conciseness fail. The R78 ``_hard_truncate_at_
# clause`` backstop truncates at the latest clean clause/sentence
# boundary. Default OFF in code (davidath A/B is a wash → slight
# negative on the quadratic length-ratio metric; the bench runner
# doesn't read railway.toml). Flipped ON here for the live deploy where
# the binary judge conciseness axis rewards ≤600-char answers — the R78
# davidath-wash / live-win discipline. Disable with
# REGENOLD_HARD_CHAR_CAP=0.
#
# R103 (2026-06-01) — DISABLED. The R102 hard cap (600) chopped
# multi-part answers mid-sentence: an 8-item enumeration (e.g. all of
# Article 5(1)'s prohibited practices (a)-(h), ~700 chars as one
# cite-anchored sentence) was truncated at 600, silently dropping
# (g) biometric categorisation + (h) real-time RBI — an incomplete
# list that reads as complete. Per the user directive: remove the
# char cap, keep the 4-sentence professional-concise bound from the
# PDF rules. The 4-sentence cap (below) + the Stage-2 prompt are the
# real length governors now. Re-enable with REGENOLD_HARD_CHAR_CAP=1.
REGENOLD_HARD_CHAR_CAP = "0"

# Round 126 — answer length: sentence cap REMOVED (operator directive
# 2026-06-18). REGENOLD_MAX_ANSWER_SENTENCES=0 disables the sentence-count
# truncation entirely (models.py::normalise_answer_for_regenold) so a
# multi-part answer is never cut mid-content / loses useful information.
# The competition PDF only *encourages* 1-4 sentences (soft) and scores
# conciseness vs the gold length — the operator accepts that trade for
# completeness. The code constant MAX_ANSWER_SENTENCES (3) is the fallback
# when the env is unset, so the davidath bench stays byte-identical. The
# soft char cap is also bypassed on the no-cap path. Revert to the R103
# behaviour with REGENOLD_MAX_ANSWER_SENTENCES=4 / =3.
REGENOLD_MAX_ANSWER_SENTENCES = "0"
REGENOLD_QA_LENGTH_CAP = "1200"

# Round 103.1 — Stage-2 dynamic grounding. The Issue-#51 drift guard
# (_detect_polished_prose_drift in graph_rag.py) rejects a Sonnet answer
# that cites a REAL EU AI Act article (present in ARTICLE_EXISTENCE) the
# deterministic retrieval didn't pre-surface, then silently falls back to
# the generic deterministic stub. Live repro: "Can a system that tracks
# patient weight be deployed or is it high-risk under Article 5?" — Sonnet
# correctly reasoned to Article 10 (data governance) + Article 6/49/71, the
# guard flagged "prose cites Art. 10 (not in catalog) — falling back to
# kg_answer", and the wire shipped an off-topic RBI/social-scoring stub.
# With dynamic grounding ON, articles that exist in ARTICLE_EXISTENCE are
# NOT counted as drift — only genuinely hallucinated (non-existent)
# citations still trip the guard. davidath byte-identical (the drift guard
# only runs when Stage-2 fires; the TestClient bench has no wrapper, so
# Stage-2 never runs there). Revert with REGENOLD_DYNAMIC_GROUNDING=0.
REGENOLD_DYNAMIC_GROUNDING = "1"

# Round 66-B — Stage-2.5 cite-describe guard. Drops references whose
# KB-summary token set doesn't overlap the answer prose (the inverse
# of the R31 sentence-level citation guard which drops sentences).
# Targets the LLM-as-Judge ``refs`` axis where the judge fails a row
# whose prose never substantively describes a cited Article.
#
# R90 (2026-05-28): DISABLED — live competition bench confirmed −0.21 ref_loose
# regression (0.44 → 0.22) when this guard ran against the regenold benchmark.
# The guard was calibrated against the internal davidath rubric where it was
# rubric-positive; it is net-negative on the competition evaluation set because
# the token-overlap threshold over-prunes refs in dense multi-article answers.
# Re-enable with: railway variables --set REGENOLD_CITE_DESCRIBE_GUARD=1
REGENOLD_CITE_DESCRIBE_GUARD = "0"

# Round 80.2 — Stage-2 LLM polish + latency knobs are now CODE
# DEFAULTS, not railway.toml overrides. The R80.1 round added them
# to [deploy.envs] but Railway dashboard service variables (when
# pinned) override railway.toml, which silently blocked production
# from picking up the change. Baking the values into the code
# defaults sidesteps that override path entirely — a fresh Railway
# deploy with NO dashboard env override gets the best config.
#
# Current defaults (in app/engines/graph_rag.py + app/config.py):
#   * P2P_GRAPH_RAG_ENABLE_STAGE2 default ON
#     (was OFF since R77; R80 measurements overturned that)
#   * P2P_GRAPH_RAG_MAX_TOKENS default 512
#     (was 1024; cuts the Sonnet-output latency tail)
#   * P2P_GRAPH_RAG_COMPLEX_THINKING_TOKENS default 1024
#     (was 2500 since R69; cuts the Opus extended-think outlier)
#
# Operators can DISABLE Stage-2 (e.g. emergency latency rollback)
# via dashboard:
#   railway variables --set P2P_GRAPH_RAG_ENABLE_STAGE2=0
# Or raise max_tokens / thinking budget similarly:
#   railway variables --set P2P_GRAPH_RAG_MAX_TOKENS=1024
#   railway variables --set P2P_GRAPH_RAG_COMPLEX_THINKING_TOKENS=2500

# Round 97 — adaptive verbatim-vs-synthesis routing (CODE DEFAULTS).
#
# R94/R96 made production effectively deterministic + verbatim: verbatim
# mode ON (default) + R96's blanket "verbatim disables Stage-2" left the
# Claude Max wrapper + Sonnet barely used. That is correct for simple
# single-turn QA (a verbatim provision quote IS the answer) but wrong for
# multi-turn / nuanced conversations the verbatim dump cannot answer
# (coreference, role flips, conflict reconciliation, cross-framework).
#
# R97 decouples verbatim from Stage-2 and adds an answer-mode router
# (app/engines/answer_router.py): multi-turn + nuanced questions route to
# Sonnet synthesis (via the wrapper / Cloudflare tunnel), simple QA stays
# on the fast deterministic verbatim path. The route keeps the synthesised
# answer (its verbatim overwrite is gated on stage2_landed).
#
# Both knobs default ON in code — no dashboard var needed (the R80.2
# dashboard-override lesson: code defaults are the reliable activation
# path). Documented here for operator visibility + rollback:
#   * REGENOLD_ANSWER_ROUTER (default ON) — set 0 to restore exact R96
#     behaviour (verbatim never runs Stage-2 = full deterministic).
#   * REGENOLD_STAGE2_MIN_CONFIDENCE_MULTITURN (default 0.3) — the lower
#     confidence floor for multi-turn synthesis (single-turn keeps the
#     R87-E 0.5 floor); coreferent follow-ups retrieve sparsely yet still
#     benefit from Sonnet synthesis across the prior turns.
# Roll back the whole round with:
#   railway variables --set REGENOLD_ANSWER_ROUTER=0

# Round 52 / Round 94 — Stage-0 intent classifier provider selection.
#
# R94: Groq Llama 3.3 70B is now the DEFAULT Stage-0 provider whenever
# ``GROQ_API_KEY`` is set — provision the key and Stage-0 routes to Groq
# automatically (no REGENOLD_INTENT_PROVIDER needed):
#   railway variables --set GROQ_API_KEY=gsk_...
# To force the historical Haiku-via-wrapper path even with a key present:
#   railway variables --set REGENOLD_INTENT_PROVIDER=wrapper
# Without a GROQ_API_KEY the wrapper/Haiku path is preserved. NOTE: the
# free Groq tier has a 100K tokens-per-DAY cap; bulk evals exhaust it and
# every 429 falls back cleanly to deterministic narrowing — use a paid
# tier for sustained production volume.
#
# (Legacy R52 framing): set to "groq" to route Stage-0 through Groq's
# serverless Llama 3.3 70B endpoint. Requires ``GROQ_API_KEY`` to be ALSO
# set; if the key is missing, the classifier falls back to the wrapper
# (no surprise silent disablement).
#
# R94 — verbatim exact-text answer mode is a CODE default (ON): the wire
# answer quotes the verbatim EUR-Lex text of cited provisions. Disable
# (revert to concise summary prose) with:
#   railway variables --set REGENOLD_VERBATIM_ANSWER=0
#
# Why this exists: planning a Claude Max → Claude Pro downgrade. Pro's
# tighter rate limits would throttle the wrapper, so the cheapest
# stage to offload (Stage-0 — a 10-way JSON classification, falls back
# cleanly to deterministic on any failure) goes to Groq first. Cost
# delta: roughly $200/mo → ~$0.50/mo at this project's volume.
# Stage-1/2 polish stays on the wrapper for tone + V2 coherence
# preservation. See CLAUDE.md round-52 for the migration plan.
#
# Provision the key via:
#   railway variables --set GROQ_API_KEY=gsk_...
#   railway variables --set REGENOLD_INTENT_PROVIDER=groq
# REGENOLD_INTENT_PROVIDER = "groq"
# GROQ_API_KEY             = "gsk_..."          # set via railway variables, not toml
# GROQ_API_BASE            = "https://api.groq.com/openai/v1"    # default
# REGENOLD_INTENT_MODEL_GROQ = "llama-3.3-70b-versatile"          # default
# GROQ_TIMEOUT_SECONDS     = "5"                                  # default

# RushDB graph — OPT-IN ONLY since R98 (it hit free-trial limits). To
# re-enable the RushDB dual-path you must set BOTH:
#   railway variables --set REGENOLD_GRAPH_BACKEND=rushdb
#   railway variables --set RUSHDB_AUTH_TOKEN=<token>   (or RUSHDB_API_KEY=<key>)
# Optional:
#   RUSHDB_BASE_URL = "https://api.rushdb.com/api/v1"
#   REGENOLD_RUSHDB_HYBRID = "1"   (per-request hybrid retrieval; also
#                                    requires REGENOLD_GRAPH_BACKEND=rushdb)
# With REGENOLD_GRAPH_BACKEND=embedded (R129 DEFAULT), the 2-hop expand uses
# the in-process SQLite property graph, /healthz/graph reports backend=embedded,
# and BOTH the Neo4j driver AND every RushDB surface are inert. Opt into the
# hosted Neo4j Aura path with REGENOLD_GRAPH_BACKEND=neo4j (see above, line ~100).
# RUSHDB_AUTH_TOKEN = "<set via railway dashboard>"
